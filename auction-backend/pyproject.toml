[project]
name = "auction-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.1",
    "jose>=1.0.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[bcrypt]>=0.3.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[tool.fastapi]
    entrypoint = "app.main:app"
