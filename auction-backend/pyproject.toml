[project]
name = "auction-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.1",
    "fawltydeps>=0.20.0",
    "jose>=1.0.0",
    "orjson>=3.13.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[bcrypt]>=0.3.1",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "sse-starlette>=3.5.0",
    "tenacity>=9.2.1",
    "vulture>=2.16",
]

[tool.fastapi]
    entrypoint = "app.main:app"
